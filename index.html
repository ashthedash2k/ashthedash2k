<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Name</title>
<meta name="description" content="Personal site — technical writing and personal writing." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <div class="stars" aria-hidden="true">
      <svg class="star star--sm star--coral" style="top:6%; left:6%; transform:rotate(-12deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--xl star--orange" style="top:12%; right:6%; transform:rotate(10deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--md star--yellow" style="top:22%; left:3%; transform:rotate(-18deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--sm star--lime" style="top:30%; right:10%; transform:rotate(24deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--lg star--mint" style="top:40%; left:8%; transform:rotate(6deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--sm star--sky" style="top:48%; right:4%; transform:rotate(20deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--md star--lavender" style="top:58%; left:5%; transform:rotate(-8deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--xl star--periwinkle" style="top:64%; right:8%; transform:rotate(-14deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--sm star--coral" style="top:74%; left:10%; transform:rotate(16deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--md star--orange" style="top:80%; right:5%; transform:rotate(-22deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--lg star--yellow" style="top:88%; left:4%; transform:rotate(12deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
      <svg class="star star--sm star--lime" style="top:94%; right:9%; transform:rotate(-6deg);" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.8l-5.8 3.4 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>
    </div>

    <header class="hero">
      <p class="hero-kicker">Hi, i'm</p>
      <h1 class="hero-name">
        Ashley
        <svg class="hero-squiggle" viewBox="0 0 220 20" aria-hidden="true">
          <path d="M2 14 C 30 4, 55 20, 85 10 S 140 2, 170 12 S 205 18, 218 8"
                fill="none" stroke="var(--pink)" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </h1>
      <p class="hero-bio">
        I study computer science at Carnegie Mellon University and I'm interested in computer systems. 
      </p>
      <ul class="hero-links">
        <li><a href="mailto:you@example.com">email</a></li>
        <li><a href="https://github.com/yourname" target="_blank" rel="noopener">github</a></li>
      </ul>
    </header>

    <nav class="tabs" role="tablist" aria-label="Writing categories">
      <button class="tab is-active" role="tab" aria-selected="true" data-tab="technical" id="tab-technical">
        Technical Writing
      </button>
      <button class="tab" role="tab" aria-selected="false" data-tab="personal" id="tab-personal">
        Personal Writing
      </button>
      <button class="tab" role="tab" aria-selected="false" data-tab="pics" id="tab-pics">
        Pics
      </button>
      <button class="tab" role="tab" aria-selected="false" data-tab="facts" id="tab-facts">
        Silly Facts About Me
      </button>
    </nav>

    <main>
      <section class="panel is-active" role="tabpanel" aria-labelledby="tab-technical" id="panel-technical">
        <ol class="post-list" id="list-technical"></ol>
      </section>

      <section class="panel" role="tabpanel" aria-labelledby="tab-personal" id="panel-personal" hidden>
        <ol class="post-list" id="list-personal"></ol>
      </section>

      <section class="panel" role="tabpanel" aria-labelledby="tab-pics" id="panel-pics" hidden>
        <div class="photo-grid" id="grid-pics"></div>
      </section>

      <section class="panel" role="tabpanel" aria-labelledby="tab-facts" id="panel-facts" hidden>
        <ul class="fact-list" id="list-facts"></ul>
        <p class="facts-cta">
          Say hi — <a href="mailto:you@example.com">you@example.com</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <p>Built with plain HTML, CSS, and JS — no framework required.</p>
    </footer>

  </div>

<script src="posts.js"></script>
<script src="script.js"></script>
</body>
</html>
